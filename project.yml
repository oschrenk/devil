# XcodeGen spec. This file is the project; Devil.xcodeproj is a build artefact
# regenerated from it by `task generate` and ignored by git. Nothing may be
# edited in the generated project, because the next generate discards it.
#
# https://github.com/yonaskolb/XcodeGen/blob/master/Docs/ProjectSpec.md
name: Devil

options:
  bundleIdPrefix: com.oschrenk
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  # Without this the generated scheme is not shared, so `xcodebuild -scheme` in
  # a clean checkout cannot see it.
  schemePathPrefix: ""

configs:
  Debug: debug
  Release: release

# Both configurations read the account-specific values from the git-ignored
# Local.xcconfig, so BUNDLE_PREFIX and DEVELOPMENT_TEAM never enter the repo.
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig

settings:
  base:
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1

packages:
  DevilKit:
    # The package lives at the repository root, alongside this file.
    path: .

targets:
  Devil:
    type: application
    platform: iOS
    sources:
      - App/Devil
      - Shared
    dependencies:
      - package: DevilKit
        product: DevilKit
      - package: DevilKit
        product: DevilProbe
      # Embeds the extension in the app, which is how a Live Activity ships.
      - target: DevilActivity
    # `UIBackgroundModes` is an array, and INFOPLIST_KEY_ settings write only
    # scalars, so it needs a real file the way the extension's does. Xcode
    # merges the generated keys into this one, so the settings below still
    # apply and this spec is still the only thing to edit.
    #
    # It keeps the Bluetooth link alive while another app is in front. A
    # capture of an unknown device is worthless if it stops the moment you
    # switch to the vendor's app to read what its display says.
    info:
      path: App/Devil/Info.plist
      properties:
        UIBackgroundModes:
          - bluetooth-central
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).devil
        # No hand-maintained Info.plist: the keys below generate one at build
        # time, which is one fewer file to keep in step with this spec.
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Devil
        # The only explanation anyone reads, so it says why, not what.
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: >-
          Devil connects to your Acaia scale to time the brew and weigh each pour.
        # Keeps the Bluetooth link alive while another app is in front. A
        # capture of an unknown device is useless if it stops the moment you
        # switch to the vendor's app to read what its display says.
        INFOPLIST_KEY_UIBackgroundModes: bluetooth-central
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Without this the app may start no Live Activity at all, and the
        # failure is a thrown error rather than anything visible.
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        SWIFT_VERSION: "6.0"

  # The Lock Screen and Dynamic Island views. A Live Activity has to live in
  # an extension: the system draws it while the app is not running, so the
  # code it draws from cannot be in the app.
  DevilActivity:
    type: app-extension
    platform: iOS
    sources:
      - App/DevilActivity
      - Shared
    # The one place a generated Info.plist will not do. An extension has to
    # declare a nested NSExtension dictionary, and INFOPLIST_KEY_ settings can
    # only write keys at the top level. Without it the app installs and then
    # fails with AppexBundleMissingNSExtensionDict.
    #
    # XcodeGen writes the file from what follows, so this spec is still the
    # only thing to edit, and the plist is ignored like the project itself.
    info:
      path: App/DevilActivity/Info.plist
      properties:
        CFBundleDisplayName: Devil
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).devil.activity
        SWIFT_VERSION: "6.0"
        SKIP_INSTALL: YES

schemes:
  # Declared rather than left to XcodeGen's defaults, so `-scheme Devil` means
  # exactly this and does not change with an XcodeGen upgrade.
  Devil:
    build:
      targets:
        Devil: all
        DevilActivity: all
    run:
      config: Debug
    archive:
      config: Release
